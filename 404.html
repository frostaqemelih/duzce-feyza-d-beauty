<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sayfa Bulunamadı | Düzce Feyza D. Beauty</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root { --background:#faf7f0; --foreground:#201914; --gold:#c79d59; --muted-foreground:#665b53; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--background); color: var(--foreground); font-family: 'Manrope', sans-serif; text-align: center; padding: 1.5rem;
  }
  .wrap { max-width: 28rem; }
  .num { font-family: 'Playfair Display', serif; font-style: italic; font-size: 6rem; color: var(--gold); margin: 0; line-height: 1; }
  h1 { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 1.6rem; margin: 1rem 0 0.75rem; }
  p { color: var(--muted-foreground); line-height: 1.6; margin: 0 0 1.75rem; }
  a.btn {
    display: inline-flex; align-items: center; gap: 0.5rem; background: var(--foreground); color: #fff;
    border-radius: 999px; padding: 0.85rem 1.75rem; font-size: 0.9rem; font-weight: 500; text-decoration: none;
    transition: background 0.25s;
  }
  a.btn:hover { background: var(--gold); color: var(--foreground); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="num">404</p>
    <h1>Bu sayfayı bulamadık</h1>
    <p>Aradığınız sayfa taşınmış veya kaldırılmış olabilir. Ana sayfaya dönüp randevu alabilir ya da hizmetlerimize göz atabilirsiniz.</p>
    <a class="btn" href="/">← Ana sayfaya dön</a>
  </div>
</body>
</html>
